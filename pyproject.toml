[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bilifocus"
version = "2.3.2"
description = "只看收藏夹的 B 站工具:零依赖的数据层 + 可替换界面"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bilifocus = "bilifocus.cli:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["bilifocus*"]
