<!DOCTYPE html>
<html lang="zh-CN">

<style>
  :root {
    --cream: #FCFAF6;
    --ink: #26343B;
    --ink-soft: #5B6B74;
    --ink-faint: #8D9AA1;
    --sky: #64C0FF;
    --sky-deep: #2A80BE;
    --sky-soft: #E8F5FF;
    --line: rgba(42, 128, 190, .14);
    --serif: "YouYuan", "幼圆", "LXGW WenKai", "KaiTi", "STKaiti", "Songti SC", "Noto Serif SC", serif;
    --sans: "YouYuan", "幼圆", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--sans);
    font-synthesis: none;
    color: var(--ink);
    background: #F6FBFE;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  /* ── 呼吸渐变背景 ─────────────────────────────── */
  .ambient {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(168deg, #F8FCFF 0%, #E8F4FC 44%, #FBF8F1 100%);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(86px); will-change: transform, opacity; }
  .glow-a {
    width: 64vw; height: 64vw; left: -18vw; top: -22vw;
    background: radial-gradient(circle at 45% 45%, rgba(132, 201, 243, .62), rgba(132, 201, 243, 0) 66%);
    animation: breathe-a 26s ease-in-out infinite;
  }
  .glow-b {
    width: 54vw; height: 54vw; right: -14vw; top: -8vw;
    background: radial-gradient(circle at 50% 50%, rgba(255, 239, 213, .92), rgba(255, 239, 213, 0) 67%);
    animation: breathe-b 33s ease-in-out infinite;
  }
  .glow-c {
    width: 50vw; height: 50vw; left: 16vw; bottom: -26vw;
    background: radial-gradient(circle at 50% 50%, rgba(174, 220, 249, .5), rgba(174, 220, 249, 0) 66%);
    animation: breathe-c 38s ease-in-out infinite;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(42, 128, 190, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(42, 128, 190, .05) 1px, transparent 1px);
    background-size: 76px 76px;
    -webkit-mask-image: radial-gradient(120% 92% at 50% 24%, #000 26%, transparent 78%);
    mask-image: radial-gradient(120% 92% at 50% 24%, #000 26%, transparent 78%);
  }
  @keyframes breathe-a {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: .55; }
    50% { transform: translate3d(3vw, 2.4vw, 0) scale(1.13); opacity: .82; }
  }
  @keyframes breathe-b {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: .6; }
    50% { transform: translate3d(-2.6vw, 3vw, 0) scale(1.09); opacity: .85; }
  }
  @keyframes breathe-c {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: .45; }
    50% { transform: translate3d(2vw, -2.6vw, 0) scale(1.12); opacity: .68; }
  }

  /* ── 顶栏 ─────────────────────────────────────── */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 20; }
  .nav {
    width: min(1180px, calc(100% - 64px)); height: 84px; margin: 0 auto;
    display: flex; align-items: center; gap: 30px;
  }
  .brand { display: inline-flex; align-items: center; gap: 11px; font-family: var(--serif); font-size: 21px; letter-spacing: .02em; }
  .brand img { width: 34px; height: 34px; border-radius: 10px; box-shadow: 0 6px 16px rgba(42, 128, 190, .18); }
  .nav-links { margin-left: auto; display: flex; align-items: center; gap: 30px; font-size: 14.5px; color: var(--ink-soft); }
  .nav-links a { transition: color .2s ease; }
  .nav-links a:hover { color: var(--sky-deep); }
  .nav-cta {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, .72); color: var(--sky-deep);
    border: 1px solid rgba(42, 128, 190, .2);
    padding: 9px 18px; border-radius: 999px; font-size: 13.5px;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .nav-cta:hover { background: #fff; border-color: rgba(42, 128, 190, .4); transform: translateY(-1px); }

  /* ── 主页面 ───────────────────────────────────── */
  main {
    position: relative; z-index: 1;
    min-height: 100svh; display: grid; place-items: center;
    padding: 128px 26px 96px;
  }
  .hero { text-align: center; max-width: 960px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 13px; letter-spacing: .16em; color: var(--sky-deep);
    background: rgba(255, 255, 255, .62); border: 1px solid rgba(42, 128, 190, .18);
    padding: 7px 16px; border-radius: 999px; backdrop-filter: blur(8px);
  }
  .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--sky); display: inline-block; }
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(46px, 7.6vw, 94px); line-height: 1.16; letter-spacing: .07em;
    margin: 30px 0 0; -webkit-text-stroke: .35px currentColor;
  }
  h1 .accent { color: var(--sky-deep); display: inline-block; }
  .lead {
    margin: 28px auto 0; max-width: 34em;
    font-size: clamp(15px, 1.55vw, 17.5px); line-height: 2; color: var(--ink-soft);
  }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 42px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    padding: 14px 30px; border-radius: 999px; font-size: 15px; cursor: pointer;
    transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .btn-primary {
    background: var(--sky-deep); color: #fff;
    box-shadow: 0 14px 32px rgba(42, 128, 190, .24);
  }
  .btn-primary:hover { transform: translateY(-2px); background: #2F8CC9; box-shadow: 0 18px 38px rgba(42, 128, 190, .3); }
  .btn-ghost {
    background: rgba(255, 255, 255, .6); color: var(--ink); border: 1px solid rgba(42, 128, 190, .18);
    backdrop-filter: blur(8px);
  }
  .btn-ghost:hover { transform: translateY(-2px); background: #fff; border-color: rgba(42, 128, 190, .4); }
  .meta-line { margin-top: 30px; font-size: 12.5px; letter-spacing: .14em; color: var(--ink-faint); }
  .scroll-hint {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    font-size: 11.5px; letter-spacing: .22em; color: var(--ink-faint);
  }
  .scroll-hint::after {
    content: ""; width: 1px; height: 36px;
    background: linear-gradient(rgba(42, 128, 190, .5), rgba(42, 128, 190, 0));
    animation: drop 2.6s ease-in-out infinite;
  }
  @keyframes drop {
    0%, 100% { transform: scaleY(.45); opacity: .35; transform-origin: top; }
    50% { transform: scaleY(1); opacity: .9; transform-origin: top; }
  }

  /* ── 入场 / 离场 ──────────────────────────────── */
  .hero > * { animation: rise .9s cubic-bezier(.22, .8, .3, 1) both; }
  .hero > :nth-child(2) { animation-delay: .08s; }
  .hero > :nth-child(3) { animation-delay: .16s; }
  .hero > :nth-child(4) { animation-delay: .24s; }
  .hero > :nth-child(5) { animation-delay: .32s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }
  body.leaving main, body.leaving header, body.leaving footer { opacity: 0; transition: opacity .22s ease; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 18px 24px; text-align: center;
    font-size: 12px; letter-spacing: .04em; color: var(--ink-faint);
  }

  @media (max-width: 760px) {
    html, body { overflow-x: clip; }
    .nav { width: calc(100% - 36px); height: 70px; gap: 12px; }
    .nav-links { gap: 14px; font-size: 13px; }
    .nav-links .hide-sm { display: none; }
    .nav-cta { display: none; }
    main { padding: 100px 20px 96px; }
    h1 { font-size: clamp(32px, 9.8vw, 48px); letter-spacing: .02em; line-height: 1.24; }
    .eyebrow { font-size: 11px; letter-spacing: .08em; padding: 6px 12px; max-width: 100%; }
    .lead { font-size: 14.5px; line-height: 1.95; padding: 0 2px; }
    .actions { flex-direction: column; align-items: stretch; max-width: 300px; margin: 32px auto 0; gap: 10px; }
    .btn { width: 100%; padding: 13px 22px; font-size: 14.5px; }
    .meta-line { font-size: 11px; letter-spacing: .06em; }
    .scroll-hint { bottom: 64px; }
    footer { position: static; padding: 26px 20px 30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .glow, .scroll-hint::after, .hero > * { animation: none !important; }
    .hero > * { opacity: 1; transform: none; }
  }

  /* 进入详情页时的开屏动画:整屏天蓝 + 眼睛动画,渐入渐出 */
  .transition-veil {
    position: fixed; inset: 0; z-index: 80;
    display: grid; place-items: center;
    background: #81DAFC;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .45s ease, visibility 0s linear .45s;
  }
  .transition-veil.active {
    opacity: 1; visibility: visible;
    transition: opacity .3s ease;
  }
  .transition-video {
    width: min(86vmin, 720px); height: auto; display: block;
    background: #81DAFC;
  }
  @media (prefers-reduced-motion: reduce) {
    .transition-veil { transition: none; }
  }

  .star-line { margin-top: 18px; font-size: 14px; color: var(--ink-soft); }
  .star-line a { color: var(--sky-deep); border-bottom: 1px solid rgba(42, 128, 190, .25); padding-bottom: 1px; }
  .star-line a:hover { border-color: var(--sky-deep); }
</style>
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="glow glow-a"></div>

</div>

<header>
  <div class="nav">
    <a class="brand" href="index.html">

    <nav class="nav-links">
      <a class="hide-sm" href="details.html" data-transition>详情</a>

      <a href="https://github.com/Hanker-Hale/FavFocus" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <a class="nav-cta" href="https://github.com/Hanker-Hale/FavFocus/releases/download/v2.2.3/FavFocus-Setup-2.2.3.exe" download data-download-setup>
      下载 Windows 版
    </a>
  </div>
</header>

<main>
  <div class="hero">
    <span class="eyebrow"><i></i>Windows · 免费开源 · 数据只存本机</span>
    <h1>打开就是收藏夹<br><span class="accent">没有推荐流</span></h1>
    <p class="lead">
      FavFocus 是一个只看你自己收藏夹的桌面工具。
      封面卡片铺开,双击全屏播放,看到哪儿记到哪儿;
      不刷推荐,不被打断。
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="details.html" data-transition>
        查看详情
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
      <a class="btn btn-ghost" href="https://github.com/Hanker-Hale/FavFocus" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.2 4.4 18.2 4.7 18.2 4.7c.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
        查看源码
      </a>
    </div>
    <p class="meta-line">全屏播放 · 进度续播 · 自动分类 · 观看日程</p>
    <p class="star-line">觉得有用的话,去 <a href="https://github.com/Hanker-Hale/FavFocus" target="_blank" rel="noopener">GitHub 点个 Star ⭐</a> 支持一下。</p>
  </div>

<div class="transition-veil" id="transition-veil" aria-hidden="true">
  <video class="transition-video" id="transition-video" src="media/eye-intro.mp4" muted playsinline preload="auto"></video>
</div>

<footer>
  © <span id="year">2026</span> Hanker Hale · FavFocus &nbsp;·&nbsp; 非官方项目,与哔哩哔哩无关联
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // 进入详情前播放开屏动画:渐入 → 播完 → 渐出 → 打开详情页
  const veil = document.getElementById('transition-veil');
  const transitionVideo = document.getElementById('transition-video');
  let transitioning = false;

  function enterDetails(href) {
    if (transitioning) return;
    transitioning = true;
    document.body.classList.add('leaving');
    if (veil) veil.classList.add('active');

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      window.location.href = href;
    };

    if (transitionVideo) {
      try {
        transitionVideo.currentTime = 0;
        const played = transitionVideo.play();
        if (played && typeof played.catch === 'function') {
          played.catch(() => setTimeout(finish, 700));
        }
        transitionVideo.addEventListener('ended', () => setTimeout(finish, 120), { once: true });
      } catch (error) {
        setTimeout(finish, 700);
      }
    }
    setTimeout(finish, 2500);
  }

  document.querySelectorAll('a[data-transition]').forEach((link) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      enterDetails(link.href);
    });
  });


  // 下载按钮直接指向 exe 资产,不跳 GitHub 页面;能取到最新 release 就替换成最新直链
  (async () => {
    try {
      const response = await fetch('https://api.github.com/repos/Hanker-Hale/FavFocus/releases/latest', {
        headers: { Accept: 'application/vnd.github+json' },
      });
      if (!response.ok) return;
      const data = await response.json();
      const assets = data.assets || [];
      const setup = assets.find((asset) => /^FavFocus-Setup-.+\.exe$/i.test(asset.name));
      if (setup) {
        document.querySelectorAll('a[data-download-setup]').forEach((link) => {
          link.href = setup.browser_download_url;
        });
      }
    } catch (error) {
      console.info('使用内置下载直链:', error.message);
    }
  })();
</script>
